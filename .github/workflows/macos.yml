name: macOS checks
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: macos-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
  MACOSX_DEPLOYMENT_TARGET: '12.0'
jobs:
  deterministic:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            toolchain: pinned
          - runner: macos-15-intel
            toolchain: pinned
          - runner: macos-15
            toolchain: stable
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test release revision handling
        run: python3 scripts/test-release-revision.py
      - name: Select stable compatibility toolchain
        if: matrix.toolchain == 'stable'
        run: echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
      - name: Install Rust
        run: rustup toolchain install --component rustfmt --component clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Match release jobs; the action also hashes toolchains and build settings.
          shared-key: macos-${{ matrix.runner }}
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT
      - name: Format, check, Clippy, test, and build
        run: ./scripts/check.sh
      - name: Warm release build dependencies
        if: github.event_name == 'push' && matrix.toolchain == 'pinned'
        run: cargo build --release --locked

  minimum-rust:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select declared minimum Rust version
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_ENV"
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["rust-version"]
          print(f"RUSTUP_TOOLCHAIN={version}")
          PYTHON
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Check minimum Rust compatibility
        run: cargo check --all-targets --all-features --locked
